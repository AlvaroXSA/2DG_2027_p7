<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p7_1</title>
    <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
    <style> 
     * {
        
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    :root{

        --lima-color: #CCFF02;
        --gris-color: #8696A8;
        --violeta-color: #E4D2FC;
        --rojo-color: #EF432B;
        --negro-color: #282625;
        --perla-color: #EFEAE8;
        --verde-color: #325444;
    }
    
            
        body {
            background-color: #282625;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .container {
            display: grid;
            width: 44%;
            height: 480px;

            grid-template-columns: 1.25fr 1.25fr 0.85fr;
            grid-template-rows: repeat(8, 1fr);

            border: 2px solid white;
        }

        .container div {
            padding: 15px;
            overflow: hidden;
        }

        .container p {
            font-size: 12px;
            margin-top: 15px;
        }

        .container h1 {
            font-size: 70px;
            font-weight: normal;
             font-family: 'Michroma', sans-serif;
    font-size: 55px;
        }

        #lima {
            background-color: var(--lima-color);
            color: var(--negro-color);
            grid-area: 1 / 1 / 3 / 2;
        }
         
            #lima h1 {
            font-size: 80px;
            transform: translateY(-13px);
            color:#325444;
    
        }
         #lima p {
            font-size: 12px;
            margin-top: 27px;
            margin-left: 10px;
        }

        #gris {
            background-color: var(--gris-color);
            color: var(--perla-color);
            grid-area: 3 / 1 / 5 / 2;
        }
         
            #gris h1 {
            font-size: 52px;
            margin-bottom: 30px;
        }
         #gris p {
            font-size: 12px;
            margin-top: 20px;
            margin-left: 10px;
        }

        #violeta {
            background-color: var(--violeta-color);
            color: var(--rojo-color);
            grid-area: 5 / 1 / 7 / 2;
        }
         
            #violeta h1 {
            font-size: 57px;
            margin-bottom: 25px;
        }
         #violeta p {
            font-size: 12px;
            margin-top: 20px;
            margin-left: 10px;
        }

        #rojo {
            background-color: var(--rojo-color);
            color: var(--perla-color);
            grid-area: 7 / 1 / 9 / 2;
        }
        
            #rojo h1 {
            font-size: 62px;
            margin-bottom: 20px;
        }
         #rojo p {
            font-size: 12px;
            margin-top: 20px;
            margin-left: 10px;
        }

        #negro {
            background-color: var(--negro-color);
            color: var(--perla-color);
            grid-area: 1 / 2 / 3 / 3;
        }
            #negro h1 {
            font-size: 65px;
            transform: translateX(-5px);
        }
         #negro p {
            font-size: 12px;
            margin-top: 0px;
            margin-left: 10px;
            transform: translateX(-15px);
        }

        #perla {
            background-color: var(--perla-color);
            color: var(--negro-color);
            grid-area: 4/ 2 / 9/ 3;

            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
         
        
        
        #perla h1 {
            font-size: 45px;
        }
          #perla p {
            transform: translateX(10px);
            transform: translatey(-10px);
           
        }

  #verde {
    background-color: var(--verde-color);
    color: var(--perla-color);
    grid-area: 1 / 3 / 9 / 4;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

#verde p {
    writing-mode: horizontal-tb;
    text-align: left;
    transform: translatey(-15px);
}

#verde h1 {
    writing-mode: vertical-rl;
    font-size: 80px;
    text-align: center;
    margin-left: auto;
    transform: translateY(-40px);
    
}
        
        #lima,
#gris,
#violeta,
#rojo {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 2px;
    
    
}
#lima h1,
#gris h1,
#violeta h1,
#rojo h1 {
    text-align: center;
    
}


</style>
   


</head>
    
    
    
    
    
    
    <body>

 <div class="container">
    
    <div id="lima">
    <p>#CCFF02</p>
    <h1>LIME</h1>
    </div>
    
    <div id="gris">
     <p>#8696A8</p>
    <h1>STORM</h1>
    </div>
   
    <div id="violeta">
     <p>#E4D2FC</p>
    <h1>VIOLET</h1>
    </div>
    
    <div id="rojo">
     <p>#EF432B</p>
    <h1>CHILLI</h1>
    </div>
    
    <div id="negro">
     <p>#282625</p>
    <h1>DARK</h1>
    </div>
    
    <div id="perla">
     <p>#EFEAE8</p>
    <h1>LIGHT &amp;<br> BRIGHT</h1>
   </div>
   
    <div id="verde">
     <p>#325444</p>
    <h1>FOREST</h1>
</div>

    </body>
